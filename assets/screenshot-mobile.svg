<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background with Gradient Accent -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F3B78" />
      <stop offset="50%" stop-color="#2D1A47" />
      <stop offset="100%" stop-color="#191530" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- TOP CARD: Continued Form (Bottom Half) -->
  <rect x="20" y="15" width="760" height="280" rx="20" fill="#1e1a3a" />
  
  <!-- Form Title (Building your plan - included for context) -->
  <text x="35" y="47" fill="#ffffff" font-size="22" font-weight="700">Build your plan</text>

  <!-- Input Field 2: Days -->
  <text x="35" y="80" fill="#ffffff" font-size="14" font-weight="600">Days to spread the plan across</text>
  <rect x="35" y="92" width="730" height="38" rx="14" fill="#3a383d" />
  <text x="48" y="116" fill="#ffffff" font-size="14">3</text>

  <!-- Input Field 3: Mood (Select Dropdown) -->
  <text x="35" y="155" fill="#ffffff" font-size="14" font-weight="600">Study mood</text>
  <rect x="35" y="167" width="730" height="38" rx="14" fill="#3a383d" />
  <text x="48" y="191" fill="#ffffff" font-size="14">Balanced</text>
  <!-- Dropdown arrow icon placeholder -->
  <path d="M752 186.5l3.5 3.5-3.5 3.5z" fill="#ffffff"/>

  <!-- Submit Button -->
  <rect x="35" y="215" width="730" height="38" rx="14" fill="#a868c2" />
  <text x="390" y="238" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Generate plan</text>

  <!-- Info Footer Text -->
  <text x="35" y="272" fill="#c3c0d6" font-size="13">The planner uses a custom AI instruction prompt to create a practical study routine.</text>

  <!-- BOTTOM CARD: Plan Output Section -->
  <rect x="20" y="310" width="760" height="120" rx="20" fill="#1e1a3a" />
  
  <!-- Output Title -->
  <text x="35" y="345" fill="#ffffff" font-size="22" font-weight="700">Plan output</text>

  <!-- Output Box and Placeholder Text -->
  <rect x="35" y="365" width="730" height="50" rx="14" fill="#141126" />
  <text x="48" y="394" fill="#ffffff" font-size="14">Your AI-generated plan will appear here.</text>
</svg>
