<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background with Gradient Accent -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F3B78" />
      <stop offset="50%" stop-color="#2D1A47" />
      <stop offset="100%" stop-color="#191530" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- MAIN CARD: Build your plan -->
  <rect x="25" y="15" width="750" height="410" rx="20" fill="#1b1836" />
  
  <!-- Form Title -->
  <text x="45" y="52" fill="#ffffff" font-size="24" font-weight="700">Build your plan</text>

  <!-- Input Field 1: Subjects -->
  <text x="45" y="90" fill="#ffffff" font-size="14" font-weight="600">Subjects (comma separated)</text>
  <rect x="45" y="102" width="710" height="40" rx="12" fill="#3a383d" />
  <text x="60" y="127" fill="#ffffff" font-size="14">ai,cyber,software engineering</text>

  <!-- Input Field 2: Days -->
  <text x="45" y="172" fill="#ffffff" font-size="14" font-weight="600">Days to spread the plan across</text>
  <rect x="45" y="184" width="710" height="40" rx="12" fill="#3a383d" />
  <text x="60" y="209" fill="#ffffff" font-size="14">1</text>

  <!-- Input Field 3: Study Mood (Focused/Selected) -->
  <text x="45" y="254" fill="#ffffff" font-size="14" font-weight="600">Study mood</text>
  <rect x="45" y="266" width="710" height="40" rx="12" fill="#3a383d" stroke="#ffffff" stroke-width="1.5" />
  <text x="60" y="291" fill="#ffffff" font-size="14">Exam prep</text>
  <!-- Dropdown Arrow Icon -->
  <path d="M 735 288 L 740 293 L 745 288" stroke="#ffffff" stroke-width="1.5" fill="none" />

  <!-- Submit Button -->
  <rect x="45" y="322" width="710" height="42" rx="12" fill="url(#btn-grad)" />
  <text x="400" y="348" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Generate plan</text>

  <!-- Footer Info Note -->
  <text x="45" y="388" fill="#a5a1b8" font-size="13">The planner uses a custom AI instruction prompt to create a practical study routine.</text>
</svg>
